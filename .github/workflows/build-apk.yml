name: Build APK

on:
  push:
    branches: [ main, LastChat ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease -x uploadCrashlyticsMappingFileRelease -x processReleaseGoogleServices --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LastChat Aloye
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
